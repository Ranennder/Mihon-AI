name: Build Windows Companion only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version embedded in the standalone Companion (does not publish a release)
        required: true
        default: v0.1.37
        type: string

permissions:
  contents: read

jobs:
  companion:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      MIHON_AI_RELEASE_TAG: ${{ inputs.release_tag }}
    defaults:
      run:
        working-directory: companion/reader-ai-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:MIHON_AI_RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Expected a vX.Y.Z Companion version'
          }
      - name: Test Companion including fast output quality
        shell: pwsh
        run: |
          python -m pip install pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows EXE
        shell: cmd
        run: build_windows_exe.bat
      - name: Test frozen instance handoff
        shell: pwsh
        env:
          MIHON_AI_TEST_COMPANION_EXE: ${{ github.workspace }}/companion/reader-ai-server/dist/MihonAiCompanion.exe
        run: |
          python -m unittest test_companion_startup.CompanionStartupTests.test_windows_second_launch_replaces_running_frozen_instance -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Name and hash the standalone artifact
        shell: pwsh
        run: |
          $assetName = "MihonAiCompanion-$env:MIHON_AI_RELEASE_TAG-windows.exe"
          $assetPath = Join-Path 'dist' $assetName
          Move-Item -LiteralPath 'dist/MihonAiCompanion.exe' -Destination $assetPath
          $asset = Get-Item -LiteralPath $assetPath
          $digest = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ release_tag=$env:MIHON_AI_RELEASE_TAG; source_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID;
             file=$assetName; bytes=$asset.Length; sha256=$digest } |
            ConvertTo-Json | Set-Content -LiteralPath 'dist/build-manifest.json' -Encoding utf8
      - name: Upload standalone EXE and provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: MihonAiCompanion-windows-${{ inputs.release_tag }}
          path: |
            companion/reader-ai-server/dist/MihonAiCompanion-*-windows.exe
            companion/reader-ai-server/dist/build-manifest.json
          if-no-files-found: error
